<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ממים</title><link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27><rect width=%2716%27 height=%2716%27 fill=%27%23151515%27/><rect x=%273%27 y=%273%27 width=%2710%27 height=%274%27 fill=%27%23e8431f%27/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Heebo:wght@500&family=Secular+One&display=swap" rel="stylesheet">
<style>
:root{--ink:#151515;--paper:#efece4;--hot:#e8431f}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:26px;padding:22px 14px 48px;font:500 17px Heebo,sans-serif;color:var(--ink);background:var(--paper)}
#bar{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap;justify-content:center}
button{font:22px 'Secular One',Heebo,sans-serif;color:var(--paper);background:var(--ink);border:2px solid var(--ink);padding:8px 26px 10px;cursor:pointer;transition:transform .08s}
button:hover{background:var(--paper);color:var(--ink)}button:active{transform:translateY(2px)}
#dl{background:var(--hot);border-color:var(--hot);color:#fff}#dl:hover{background:var(--paper);color:var(--hot)}
#tm{min-width:92px;border:2px solid var(--ink);padding:4px 10px 0;display:flex;flex-direction:column;justify-content:space-between;font:20px 'Secular One',Heebo,sans-serif;direction:ltr;text-align:center}
#pg{height:5px;margin:0 -10px;background:#15151520}#rg{height:100%;width:0;background:var(--ink)}
#fr{position:relative;padding:8px;background:#fff;border:2px solid var(--ink)}
#fr::before{content:"";position:absolute;top:-13px;left:50%;width:84px;height:24px;margin-left:-42px;background:#e6d28bcc;transform:rotate(-2deg)}
#cv{display:block;max-width:min(88vw,720px);max-height:58vh;width:auto;height:auto}
#em{max-width:360px;padding:40px 24px;border:2px dashed var(--ink);text-align:center;line-height:1.5}
#ins{display:grid;gap:14px;width:min(92vw,720px);grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
textarea{font:inherit;color:var(--ink);background:#fbfaf6;border:2px solid var(--ink);border-inline-start:12px solid var(--c);padding:10px 12px;resize:vertical;outline:0}
textarea:focus{background:#fff;outline:2px dashed var(--ink);outline-offset:3px}
</style></head><body>
<div id="bar">
<button id="sh">הבא</button>
<div id="tm"><b id="tx">0:00</b><div id="pg"><div id="rg"></div></div></div>
<button id="dl">שמור</button></div>
<div id="fr"><canvas id="cv"></canvas></div>
<div id="em" hidden>אין תבניות.<br>שימו תמונות בתיקיית templates/ ודחפו.</div>
<div id="ins"></div>
<script>
const $=s=>document.querySelector(s),cv=$('#cv'),HU=[12,215,150,45,285,330],col=i=>`hsl(${HU[i%6]} 75% 42%)`;
let list=[],cur=-1,img,base=[1,1],boxes=[],foc=-1,acc=0,last=performance.now();
const heb=s=>/[\u0590-\u05ff]/.test(s);
// Hebrew: Secular One (heavy, tight, Impact-like). Latin: Anton.
const FF=t=>heb(t)?"'Secular One',Heebo,sans-serif":"Anton,'Secular One',sans-serif";
function wrap(x,t,w){const L=[];for(const p of t.split('\n')){let l='';for(const wd of p.split(/\s+/).filter(Boolean)){const n=l?l+' '+wd:wd;if(l&&x.measureText(n).width>w){L.push(l);l=wd}else l=n}L.push(l)}
return{L,ok:L.every(l=>x.measureText(l).width<=w)}}
function fit(x,t,bx,by,bw,bh,fill){x.direction=heb(t)?'rtl':'ltr';x.textAlign='center';x.textBaseline='middle';x.lineJoin='round';t=t.toUpperCase();const ff=FF(t);
let s=bh,r;for(;s>8;s-=2){x.font=`${s}px ${ff}`;r=wrap(x,t,bw);if(r.ok&&r.L.length*s*1.08<=bh)break}
x.font=`${s}px ${ff}`;r=wrap(x,t,bw);const y0=by+bh/2-r.L.length*s*1.08/2+s*.54;x.lineWidth=Math.max(2,s/7);x.strokeStyle=fill=='#000'?'#fff':'#000';x.fillStyle=fill=='#000'?'#000':'#fff';
r.L.forEach((l,i)=>{x.strokeText(l,bx+bw/2,y0+i*s*1.08);x.fillText(l,bx+bw/2,y0+i*s*1.08)})}
function render(c,W,H,hl){c.width=W;c.height=H;const x=c.getContext('2d'),tas=document.querySelectorAll('textarea');x.drawImage(img,0,0,W,H);
boxes.forEach((b,i)=>{const t=tas[i]?.value||'';if(t.trim())fit(x,t,b.x*W,b.y*H,b.w*W,b.h*H,b.color);
if(hl&&i===foc){x.strokeStyle=col(i);x.lineWidth=Math.max(3,W/200);x.setLineDash([12,8]);x.strokeRect(b.x*W,b.y*H,b.w*W,b.h*H);x.setLineDash([])}})}
const draw=()=>img&&render(cv,...base,1);
async function go(){
if(!list.length){$('#em').hidden=false;$('#fr').hidden=true;return}
const i=Math.random()*list.length|0; // plain random pick: repeats (even back-to-back) are allowed
const f=list[i],im=new Image();im.src='templates/'+encodeURI(f);try{await im.decode()}catch{return}
cur=i;img=im;let c;try{c=await(await fetch(`templates/${encodeURI(f.replace(/\.\w+$/,''))}.json`)).json()}catch{}
boxes=c?.boxes||[{x:.03,y:.02,w:.94,h:.22},{x:.03,y:.76,w:.94,h:.22}];
const s=Math.min(1,1080/Math.max(im.width,im.height));base=[Math.round(im.width*s),Math.round(im.height*s)];
$('#ins').replaceChildren(...boxes.map((b,k)=>{const t=document.createElement('textarea');t.rows=2;t.dir='auto';t.style.setProperty('--c',col(k));t.oninput=draw;t.onfocus=()=>{foc=k;draw()};t.onblur=()=>{foc=-1;draw()};return t}));
acc=0;draw()}
$('#sh').onclick=go;
// MozJPEG (WASM) makes noticeably smaller files than canvas.toBlob at the same look; falls back to the browser encoder if the CDN is unreachable.
let mozP;const moz=()=>mozP||(mozP=import('https://cdn.jsdelivr.net/npm/@jsquash/jpeg@1.6.0/encode.js').then(m=>m.default));
async function encode(c){try{const e=await moz(),d=c.getContext('2d').getImageData(0,0,c.width,c.height);
return new Blob([await e(d,{quality:78,progressive:true,optimize_coding:true,trellis_multipass:true,trellis_opt_zero:true,trellis_opt_table:true})],{type:'image/jpeg'})}
catch{return new Promise(r=>c.toBlob(r,'image/jpeg',.8))}}
$('#dl').onclick=async()=>{if(!img)return;const c=document.createElement('canvas');render(c,...base,0);
const b=await encode(c),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='meme-'+Date.now()+'.jpg';a.click()};
setInterval(()=>{const n=performance.now();if(!document.hidden)acc+=n-last;last=n;const s=acc/1000|0;
$('#tx').textContent=(s/60|0)+':'+String(s%60).padStart(2,'0');$('#rg').style.width=(acc%6e4)/600+'%'},250);
(async()=>{try{list=await(await fetch('templates/manifest.json')).json()}catch{}
await Promise.all([document.fonts.load('40px Anton','A'),document.fonts.load("40px 'Secular One'",'א')]).catch(()=>{});
document.fonts.onloadingdone=draw;go()})();
</script></body></html>
