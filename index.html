<!doctype html>
<html lang="he"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🎭</title><link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 10 10%27><text y=%27.9em%27 font-size=%278%27>🎭</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Heebo:wght@800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:22px;padding:22px 14px 40px;font:800 18px Heebo,sans-serif;color:#fff;background:#0c0a1d;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-40%;z-index:-1;background:radial-gradient(circle at 20% 30%,#ff2d7a66,transparent 30%),radial-gradient(circle at 80% 20%,#00e5ff55,transparent 30%),radial-gradient(circle at 50% 85%,#ffd60a50,transparent 35%);animation:sp 30s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#bar{display:flex;align-items:center;gap:16px;padding:10px 16px;border-radius:99px;background:#ffffff14;backdrop-filter:blur(10px);border:1px solid #ffffff25}
button{all:unset;cursor:pointer;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ff2d7a,#ff9f1c);box-shadow:0 6px 0 #7a0f3b;transition:.15s}
button:nth-of-type(2){background:linear-gradient(135deg,#00e5ff,#7c4dff);box-shadow:0 6px 0 #231a73}
button:hover{transform:translateY(-2px) rotate(-6deg)}button:active{transform:translateY(5px);box-shadow:0 1px 0 #0006}
button svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
#tm{position:relative;width:56px;height:56px;display:grid;place-items:center;font:12px Anton,Heebo;letter-spacing:.5px}
#tm svg{position:absolute;inset:0;transform:rotate(-90deg)}#tm circle{fill:none;stroke-width:5}
#tm circle:first-child{stroke:#ffffff22}#rg{stroke:#ffd60a;stroke-dasharray:151;stroke-linecap:round}
#fr{padding:10px;background:#fff;border-radius:6px;box-shadow:8px 8px 0 #ff2d7a,16px 16px 0 #00e5ff80;transform:rotate(var(--r,0deg));transition:transform .5s cubic-bezier(.3,1.7,.5,1)}
#cv{display:block;max-width:min(88vw,720px);max-height:58vh;width:auto;height:auto}
#em{width:min(80vw,360px);aspect-ratio:1;border:4px dashed #ffffff55;border-radius:28px;display:grid;place-items:center}
#em svg{width:90px;stroke:#ffffff77;fill:none;stroke-width:2}
#ins{display:grid;gap:14px;width:min(92vw,720px);grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
textarea{font:inherit;color:#fff;background:#ffffff12;border:3px solid var(--c);border-radius:16px;padding:12px 14px;resize:vertical;outline:0;transition:.2s}
textarea:focus{background:#ffffff22;box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 40%,transparent),0 0 24px var(--c)}
</style></head><body>
<div id="bar">
<button id="sh" aria-label="shuffle"><svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
<div id="tm"><svg viewBox="0 0 56 56"><circle cx="28" cy="28" r="24"/><circle id="rg" cx="28" cy="28" r="24"/></svg><b id="tx">0:00</b></div>
<button id="dl" aria-label="download"><svg viewBox="0 0 24 24"><path d="M12 3v12M6 10l6 6 6-6M4 21h16"/></svg></button></div>
<div id="fr"><canvas id="cv"></canvas></div>
<div id="em" hidden><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg></div>
<div id="ins"></div>
<script>
const $=s=>document.querySelector(s),cv=$('#cv'),HU=[340,45,160,200,270,20],col=i=>`hsl(${HU[i%6]} 95% 60%)`;
let list=[],bag=[],cur=-1,img,base=[1,1],boxes=[],foc=-1,acc=0,last=performance.now();
const heb=s=>/[\u0590-\u05ff]/.test(s);
function wrap(x,t,w){const L=[];for(const p of t.split('\n')){let l='';for(const wd of p.split(/\s+/).filter(Boolean)){const n=l?l+' '+wd:wd;if(l&&x.measureText(n).width>w){L.push(l);l=wd}else l=n}L.push(l)}
 return{L,ok:L.every(l=>x.measureText(l).width<=w)}}
function fit(x,t,bx,by,bw,bh,fill){x.direction=heb(t)?'rtl':'ltr';x.textAlign='center';x.textBaseline='middle';x.lineJoin='round';t=t.toUpperCase();
 let s=bh,r;for(;s>8;s-=2){x.font=`${s}px Anton,Heebo`;r=wrap(x,t,bw);if(r.ok&&r.L.length*s*1.08<=bh)break}
 x.font=`${s}px Anton,Heebo`;r=wrap(x,t,bw);const y0=by+bh/2-r.L.length*s*1.08/2+s*.54;x.lineWidth=Math.max(2,s/7);x.strokeStyle=fill=='#000'?'#fff':'#000';x.fillStyle=fill=='#000'?'#000':'#fff';
 r.L.forEach((l,i)=>{x.strokeText(l,bx+bw/2,y0+i*s*1.08);x.fillText(l,bx+bw/2,y0+i*s*1.08)})}
function render(c,W,H,hl){c.width=W;c.height=H;const x=c.getContext('2d'),tas=document.querySelectorAll('textarea');x.drawImage(img,0,0,W,H);
 boxes.forEach((b,i)=>{const t=tas[i]?.value||'';if(t.trim())fit(x,t,b.x*W,b.y*H,b.w*W,b.h*H,b.color);
  if(hl&&i===foc){x.strokeStyle=col(i);x.lineWidth=Math.max(3,W/200);x.setLineDash([12,8]);x.strokeRect(b.x*W,b.y*H,b.w*W,b.h*H);x.setLineDash([])}})}
const draw=()=>img&&render(cv,...base,1);
async function go(){
 if(!list.length){$('#em').hidden=false;$('#fr').hidden=true;return}
 let i=bag.pop();if(i===undefined){bag=[...list.keys()].sort(()=>Math.random()-.5);i=bag.pop()}
 if(i===cur&&list.length>1)return go();
 const f=list[i],im=new Image();im.src='templates/'+encodeURI(f);try{await im.decode()}catch{return}
 cur=i;img=im;let c;try{c=await(await fetch(`templates/${encodeURI(f.replace(/\.\w+$/,''))}.json`)).json()}catch{}
 boxes=c?.boxes||[{x:.03,y:.02,w:.94,h:.22},{x:.03,y:.76,w:.94,h:.22}];
 const s=Math.min(1,1080/Math.max(im.width,im.height));base=[Math.round(im.width*s),Math.round(im.height*s)];
 $('#ins').replaceChildren(...boxes.map((b,k)=>{const t=document.createElement('textarea');t.rows=2;t.dir='auto';t.style.setProperty('--c',col(k));t.oninput=draw;t.onfocus=()=>{foc=k;draw()};t.onblur=()=>{foc=-1;draw()};return t}));
 acc=0;$('#fr').style.setProperty('--r',(Math.random()*6-3)+'deg');draw()}
$('#sh').onclick=go;
$('#dl').onclick=async()=>{if(!img)return;let sc=1,q=.92,b;
 for(let k=0;k<16;k++){const c=document.createElement('canvas');render(c,Math.round(base[0]*sc),Math.round(base[1]*sc),0);
  b=await new Promise(r=>c.toBlob(r,'image/jpeg',q));if(b.size<1e5)break;q>.6?q-=.1:sc*=.85}
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='meme-'+Date.now()+'.jpg';a.click()};
setInterval(()=>{const n=performance.now();if(!document.hidden)acc+=n-last;last=n;const s=acc/1000|0;
 $('#tx').textContent=(s/60|0)+':'+String(s%60).padStart(2,'0');$('#rg').style.strokeDashoffset=151*(1-(acc%6e4)/6e4)},250);
(async()=>{try{list=await(await fetch('templates/manifest.json')).json()}catch{}
 await Promise.all([document.fonts.load('40px Anton','A'),document.fonts.load('800 40px Heebo','א')]).catch(()=>{});
 document.fonts.onloadingdone=draw;go()})();
</script></body></html>
